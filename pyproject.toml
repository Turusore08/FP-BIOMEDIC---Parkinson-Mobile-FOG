[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mobilefog"
version = "0.1.0"
description = "Mobile-FOG: Smartphone Video Freezing-of-Gait Detection in Parkinson's Disease"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
slides = ["matplotlib", "pillow", "python-pptx", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
